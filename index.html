    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f4f7f6; color: #333; margin: 0; padding: 20px; }

<script>
    // Dữ liệu 11 đề trích xuất từ "CÁC BỘ ĐỀ MÔ PHỎNG.pdf"
    const mockData = {
        "1": [
            { q: "Câu 1: Bạn đang tiến vào khu dân cư đông đúc, phía trước là vạch kẻ đường dành cho người đi bộ. Chiếc xe phía trước đột ngột sáng đèn phanh vì có người đi bộ đang chuẩn bị bước xuống lòng đường để qua đường. Phương án xử lý của bạn là:[cite: 1]", o: ["A. Đánh lái sang làn bên cạnh để vượt xe phía trước và tiếp tục hành trình.[cite: 1]", "B. Giữ nguyên tốc độ và lách qua khoảng trống giữa xe phía trước và người đi bộ.[cite: 1]", "C. Hạ tốc độ, duy trì khoảng cách an toàn và chuẩn bị dừng hẳn nếu người đi bộ đi sang đường.[cite: 1]", "D. Bấm còi liên tục để yêu cầu người đi bộ nhường đường cho xe cơ giới.[cite: 1]"], a: 2 },
            { q: "Câu 2: Phía trước bạn là một chiếc xe buýt đang dừng tại điểm để đón trả khách. Bạn nhận thấy xe phía trước đang phanh lại hoặc có khả năng có người đi bộ bất ngờ bước ra từ phía đầu xe buýt. Phương án xử lý của bạn là:[cite: 1]", o: ["A. Nhấn còi liên tục và tăng tốc để vượt qua xe buýt thật nhanh.[cite: 1]", "B. Giữ khoảng cách rộng hơn bình thường với xe buýt, chủ động giảm tốc độ và quan sát kỹ hai bên đầu xe buýt để phòng ngừa người đi bộ băng ngang.[cite: 1]", "C. Tiếp tục di chuyển sát xe buýt để không cho người đi bộ có khoảng trống đi ra.[cite: 1]", "D. Dừng lại hẳn phía sau xe buýt và chờ cho đến khi xe buýt chuyển bánh mới đi tiếp.[cite: 1]"], a: 1 },
            { q: "Câu 3: Phía trước bạn là một chiếc xe bồn trộn bê tông đang chiếm phần lớn diện tích mặt đường. Tài xế xe bê tông bắt đầu lần dần sang làn đường của bạn để tránh một vật cản bên lề đường của họ. Phương án xử lý của bạn là:[cite: 1]", o: ["A. Nhấn ga mạnh để vượt qua xe bê tông trước khi bị ép vào lề.[cite: 1]", "B. Đi song song với xe bê tông để yêu cầu họ giữ đúng làn đường.[cite: 1]", "C. Chủ động giảm tốc độ và nhường đường, ép xe về phía an toàn bên phải.[cite: 1]", "D. Bám sát đuôi xe bê tông và bấm còi liên tục để phản đối.[cite: 1]"], a: 2 },
            { q: "Câu 4: Bạn đang lái xe vào một đoạn đường hẹp, vừa lúc đó ở phía đối diện có một xe khác cũng đang tiến vào, khiến không gian còn lại không đủ để hai xe tránh nhau một cách thoải mái. Phương án xử lý của bạn là:[cite: 1]", o: ["A. Nhấn ga tăng tốc để chiếm đường đi trước, buộc xe đối diện phải dừng lại.[cite: 1]", "B. Giảm tốc độ về mức an toàn, chủ động nhường đường nếu cần thiết để tránh xung đột giao thông.[cite: 1]", "C. Giữ nguyên tốc độ và đi sát vào giữa đường để ép xe đối diện phải lùi lại.[cite: 1]", "D. Phanh gấp, dừng hẳn xe lại chờ xe đối diện đi qua.[cite: 1]"], a: 1 },
            { q: "Câu 5: Khi đang di chuyển ở vận tốc ổn định phía sau một chiếc xe tải, bất ngờ bạn thấy đèn phanh của xe tải đỏ rực đột ngột, báo hiệu một tình huống dừng khẩn cấp phía trước. Phương án xử lý của bạn là:[cite: 1]", o: ["A. Đánh lái nhanh sang làn bên cạnh để tránh va chạm với đuôi xe tải.[cite: 1]", "B. Giữ nguyên tốc độ và chuẩn bị rẽ vào lề đường bên phải.[cite: 1]", "C. Đạp phanh dứt khoát nhưng có kiểm soát, duy trì khoảng cách an toàn để tránh va chạm liên hoàn.[cite: 1]", "D. Phanh cháy lốp và dừng xe ngay lập tức mà không cần quan sát gương hậu.[cite: 1]"], a: 2 },
            { q: "Câu 6: Tại một giao lộ phía bên trái bị che khuất tầm nhìn bởi cây cối, bạn thấy đầu một chiếc xe từ đường nhánh đang nhô ra và tiến rất gần vào phần đường chính bạn đang đi. Phương án xử lý của bạn là:[cite: 1]", o: ["A. Tăng tốc để nhanh chóng thoát khỏi khu vực giao lộ.[cite: 1]", "B. Giảm tốc độ, quan sát kỹ vào phía trong đường nhánh và sẵn sàng dừng xe.[cite: 1]", "C. Bấm còi hối thúc liên tục để xe từ đường nhánh phải dừng lại nhường đường.[cite: 1]", "D. Bám sát vào đuôi xe đi trước để cùng nhau vượt qua giao lộ.[cite: 1]"], a: 1 },
            { q: "Câu 7: Bạn đang lái xe trong khu vực trong phố, với nhiều xe ô tô đỗ san sát hai bên đường. Đột ngột, một cánh cửa xe bên đường mở toang ngay trước hướng di chuyên của xe bạn. Phương án xử lý của bạn là:[cite: 1]", o: ["A. Giữ tốc độ và đánh lái gấp sang làn bên cạnh để tránh va chạm.[cite: 1]", "B. Duy trì tốc độ chậm, giữ khoảng cách an toàn với hai bên và sẵn sàng phanh dừng.[cite: 1]", "C. Bám sát xe phía trước và nhấn còi không ngừng để yêu cầu đường đi.[cite: 1]", "D. Dừng xe đột ngột để chờ xe bên đường đóng cửa rồi mới di chuyển.[cite: 1]"], a: 1 },
            { q: "Câu 8: Bạn đang lưu thông trên đường thì thấy chiếc xe phía trước dừng lại khá lâu giữa làn đường. Bất ngờ, đèn lùi của xe đó bật sáng và xe bắt đầu lùi thẳng về phía đầu xe bạn. Phương án xử lý của bạn là:[cite: 1]", o: ["A. Nhấn ga tăng tốc và lách nhanh sang làn bên cạnh để tránh.[cite: 1]", "B. Bấm còi liên tục và bám sát đuôi xe phía trước để buộc họ dừng lùi.[cite: 1]", "C. Dừng xe lại ở khoảng cách an toàn, giữ khoảng trống đủ để xử lý tình huống.[cite: 1]", "D. Quan sát phía sau và lùi xe đến khi xe phía trước dừng lại.[cite: 1]"], a: 2 },
            { q: "Câu 9: Tại một ngã tư lớn, có một chiếc xe khách 16 chỗ đang chờ và bắt đầu từ từ tiến ra để chiếm làn đường chính. Do thân xe dài và điểm mù lớn, tài xế có thể không quan sát thấy xe bạn. Phương án xử lý của bạn là:[cite: 1]", o: ["A. Tăng tốc và nháy đèn pha để ép xe 16 chỗ phải dừng lại nhường đường.[cite: 1]", "B. Chủ động giảm tốc độ từ sớm vì xe lớn khó quan sát, sẵn sàng nhường đường.[cite: 1]", "C. Bấm còi liên tục và đi sát vào đầu xe 16 chỗ để khẳng định ưu tiên.[cite: 1]", "D. Đánh lái sang phần đường đối diện, tăng tốc để vượt qua xe khách.[cite: 1]"], a: 1 },
            { q: "Câu 10: Một chiếc xe tải đang dừng đỗ trái phép giữa đường làm che khuất hoàn toàn tầm nhìn phía trước, khiến các phương tiện đi trước bạn phải lấn sang làn ngược chiều để vượt qua. Phương án xử lý của bạn là:[cite: 1]", o: ["A. Giữ tốc độ, bám đuôi xe phía trước để cùng vượt qua xe tải thật nhanh.[cite: 1]", "B. Tuyệt đối không vượt ngay, giảm tốc độ và quan sát kỹ phía trước trước khi quyết định.[cite: 1]", "C. Nháy đèn pha và bấm còi liên tục để yêu cầu xe tải phải di chuyển đi nơi khác.[cite: 1]", "D. Đánh lái sang làn bên cạnh để không cho các xe ngược chiều chen vào.[cite: 1]"], a: 1 }
        ],
        "2": [
            { q: "Câu 1: Bạn đang lái xe và gặp tình huống có người đi bộ phía sau xe tải. Trong khi xe tải lớn phía trước đang che khuất hoàn toàn tầm nhìn bên phải của bạn, người đi bộ bất ngờ bước ra từ sau xe tải đó. Phương án xử lý của bạn là:[cite: 1]", o: ["A. Chủ động rà phanh trước khi vượt qua điểm khuất, hạ tốc độ sâu, giữ khoảng cách an toàn và ưu tiên nhường đường.[cite: 1]", "B. Tăng tốc thật nhanh để vượt qua xe tải và tránh người đi bộ.[cite: 1]", "C. Giữ tốc độ và bấm còi liên tục để cảnh báo người đi bộ.[cite: 1]", "D. Dừng lại đột ngột ngay giữa đường để chờ người đi bộ đi sang hết.[cite: 1]"], a: 0 },
            { q: "Câu 2: Bạn đang tiến tới một giao lộ phía bên trái có tầm nhìn hạn chế do tường rào. Đột ngột một chiếc xe con từ đường nhánh tiến ra và có dấu hiệu cắt ngang qua hướng di chuyển của bạn để sang đường. Phương án xử lý của bạn là:[cite: 1]", o: ["A. Giữ nguyên tốc độ vì bạn đang lưu thông trên đường ưu tiên.[cite: 1]", "B. Tăng tốc để nhanh chóng vượt qua đầu xe con trước khi họ lao ra giữa đường.[cite: 1]", "C. Chủ động giảm tốc độ, đặt chân vào bàn đạp phanh và sẵn sàng dừng lại nếu xe con không nhường.[cite: 1]", "D. Đánh lái gấp sang phải để né tránh va chạm.[cite: 1]"], a: 2 },
            { q: "Câu 3: Chiếc xe buýt đang đậu tại điểm dừng bất ngờ bật tín hiệu xi nhan trái và bắt đầu từ từ chuyển bảnh lấn ra làn đường của bạn để nhập làn. Phương án xử lý của bạn là:[cite: 1]", o: ["A. Nhấn ga tăng tốc để ngăn cản xe buýt không được nhập làn trước mặt xe mình.[cite: 1]", "B. Giữ nguyên tốc độ và bấm còi mạnh để cảnh báo xe buýt phải nhường đường chính.[cite: 1]", "C. Chủ động giảm tốc độ để tạo một khoảng trống an toàn cho xe buýt nhập làn.[cite: 1]", "D. Bám sát đuôi xe đi trước không cho xe buýt lấn sang làn của bạn.[cite: 1]"], a: 2 },
            { q: "Câu 4: Khi đang di chuyển qua khu vực đường nông thôn không có rào chắn, bạn phát hiện một con bò đang đứng thong dong ngay giữa phần đường dành cho xe chạy. Phương án xử lý của bạn là:[cite: 1]", o: ["A. Bấm còi liên tục để con bò sợ hãi mà chạy khỏi đường.[cite: 1]", "B. Giữ nguyên tốc độ và đánh lái vòng qua con bò với khoảng cách hẹp.[cite: 1]", "C. Giảm tốc độ sâu, có thể bấm còi nhẹ để cảnh báo động vật tránh ra.[cite: 1]", "D. Phanh gấp và dừng xe lại ngay sát vị trí con bò đang đứng.[cite: 1]"], a: 2 },
            { q: "Câu 5: Tầm nhìn phía trước của bạn bị một chiếc xe tải đang đỗ che khuất, bất ngờ có một người đi xe máy đi ngược chiều đi ra từ phía đầu chiếc xe tải đó. Phương án xử lý của bạn là:[cite: 1]", o: ["A. Nhấn ga tăng tốc để vượt qua đoạn khuất của xe tải thật nhanh.[cite: 1]", "B. Bấm còi liên tục để xe máy ngược chiều phải dạt vào lề.[cite: 1]", "C. Rà nhẹ chân phanh trước khi vượt qua xe tải và duy trì khoảng cách an toàn.[cite: 1]", "D. Phanh gấp ngay lập tức khi phát hiện có bóng xe máy.[cite: 1]"], a: 2 },
            { q: "Câu 6: Một chiếc xe container ở làn bên cạnh đột ngột đánh lái chuyển hướng cắt ngang qua đầu xe bạn mà không hề có tín hiệu báo trước. Phương án xử lý của bạn là:[cite: 1]", o: ["A. Đánh lái và tăng tốc để cố gắng lách qua trước khi xe container cắt đầu.[cite: 1]", "B. Lập tức giảm tốc độ, giữ khoảng cách an toàn để tránh va chạm trực diện.[cite: 1]", "C. Phanh gấp để tránh xa container vượt ẩu.[cite: 1]", "D. Giữ nguyên ga và không đạp phanh để buộc tài xế xe lớn phải nhường.[cite: 1]"], a: 1 },
            { q: "Câu 7: Một chiếc xe 16 chỗ từ đường nhánh phía bên phải đang từ từ tiến ra và bắt đầu nhập vào làn đường của bạn một cách quyết đoán. Phương án xử lý của bạn là:[cite: 1]", o: ["A. Nhấn ga tăng tốc để xe 16 chỗ không thể nhập làn thành công.[cite: 1]", "B. Hạ tốc độ từ sớm, giữ khoảng cách an toàn để tạo điều kiện cho xe nhập làn.[cite: 1]", "C. Bám sát đuôi xe phía trước, không cho xe khách nhập làn.[cite: 1]", "D. Nhấn còi liên tục và giữ tốc độ, kiên quyết không nhường đường.[cite: 1]"], a: 1 },
            { q: "Câu 8: Bạn đang di chuyển trên đoạn đường cong vào ban ngày, mặc dù có biển báo nguy hiểm nhưng tầm nhìn phía trước vẫn bị che khuất hoàn toàn bởi vách núi. Phương án xử lý của bạn là:[cite: 1]", o: ["A. Tăng tốc độ để thử cảm giác lái qua những khúc cua.[cite: 1]", "B. Hạ tốc độ, giữ khoảng cách an toàn và chú ý quan sát gương cầu lồi nếu có.[cite: 1]", "C. Đánh lái rộng sang làn đường ngược chiều để mở rộng tầm mắt nhìn xa hơn.[cite: 1]", "D. Nhấn còi liên tục nhưng vẫn giữ nguyên tốc độ cao để cảnh báo xe đối diện.[cite: 1]"], a: 1 },
            { q: "Câu 9: Bạn đang lái xe trên đoạn đường có mặt đường rất xấu, chiếc xe tải phía trước liên tục đánh lái qua hai bên để né các hố sâu và đá hộc. Phương án xử lý của bạn là:[cite: 1]", o: ["A. Bám sát và sẵn sàng tăng tốc để tìm cơ hội vượt qua chiếc xe tải đi chậm đó.[cite: 1]", "B. Kiên nhẫn giảm tốc độ, giữ khoảng cách an toàn tối đa với xe phía trước.[cite: 1]", "C. Đánh lái liên tục cùng với xe tải phía trước để né ổ gà.[cite: 1]", "D. Giữ tốc độ và phanh gấp mỗi khi bạn thấy xe tải phía trước đỏ đèn phanh.[cite: 1]"], a: 1 },
            { q: "Câu 10: Bạn đang đi sau một chiếc xe chở đồ nội thất cồng kềnh, hàng hóa vượt quá kích thước thùng xe và đang rung lắc dữ dội theo mỗi nhịp xe chạy. Phương án xử lý của bạn là:[cite: 1]", o: ["A. Nhấn ga tăng tốc để vượt qua thật nhanh trước khi hàng hóa rơi xuống đầu xe bạn.[cite: 1]", "B. Chủ động giảm tốc độ và duy trì khoảng cách an toàn cực lớn với xe tải.[cite: 1]", "C. Chạy song song xe tải và ra hiệu cho tài xế biết hàng hóa đang bị lỏng lẻo.[cite: 1]", "D. Bấm còi hối thúc xe tải chạy nhanh hơn để mau chóng kết thúc đoạn đường này.[cite: 1]"], a: 1 }
        ],
        "3": [
            { q: "Câu 1: Một người điều khiển xe máy đi phía trước đang bám sát vạch phân làn và có biểu hiện tay lái không ổn định, liên tục chao đảo. Bất ngờ, xe máy này đột ngột lấn sang làn đường của bạn mà không có tín hiệu xi nhan. Phương án xử lý của bạn là:[cite: 1]", o: ["A. Tăng tốc để vượt qua xe máy nhằm tránh rắc rối.[cite: 1]", "B. Giữ nguyên tốc độ, áp sát xe máy và bấm còi để nhắc nhở tài xế đi đúng làn.[cite: 1]", "C. Chủ động giảm tốc độ, giữ khoảng cách an toàn và hơi lệch sang phía an toàn để tránh va chạm.[cite: 1]", "D. Phanh gấp ngay lập tức chờ xe máy đi qua.[cite: 1]"], a: 2 },
            { q: "Câu 2: Khi đang di chuyển ở vận tốc ổn định phía sau một chiếc xe tải, bất ngờ bạn thấy đèn phanh của xe tải đỏ rực đột ngột, báo hiệu một tình huống dừng khẩn cấp phía trước. Phương án xử lý của bạn là:[cite: 1]", o: ["A. Đánh lái nhanh sang làn bên cạnh để tránh va chạm với đuôi xe tải.[cite: 1]", "B. Giữ nguyên tốc độ và chuẩn bị rẽ vào lề đường bên phải.[cite: 1]", "C. Đạp phanh dứt khoát nhưng có kiểm soát, duy trì khoảng cách an toàn để tránh va chạm liên hoàn.[cite: 1]", "D. Phanh cháy lốp và dừng xe ngay lập tức mà không cần quan sát gương hậu.[cite: 1]"], a: 2 },
            { q: "Câu 3: Bạn nhìn thấy biển báo khu vực đang thi công từ xa và xuất hiện các cọc tiêu, rào chắn cùng công nhân đang làm việc ngay trên mặt đường. Phương án xử lý của bạn là:[cite: 1]", o: ["A. Tăng tốc độ để nhanh chóng thoát khỏi khu vực đầy bụi bặm của công trường.[cite: 1]", "B. Đánh lái nhanh để lách qua các xe khác và tiếp tục hành trình.[cite: 1]", "C. Đánh lái liên tục giữa các cọc tiêu để tìm đường đi ngắn nhất.[cite: 1]", "D. Giảm tốc độ sâu, di chuyển đúng theo làn đường tạm và tuân thủ người điều tiết.[cite: 1]"], a: 3 },
            { q: "Câu 4: Chiếc xe khách di chuyển phía trước bạn bất ngờ đánh lái gấp sang làn đường bên cạnh để né tránh một vật cản lớn rơi trên đường mà bạn chưa nhìn thấy. Phương án xử lý của bạn là:[cite: 1]", o: ["A. Nhấn ga để bám theo xe khách sang làn đường mới.[cite: 1]", "B. Giữ nguyên tốc độ và tiếp tục đi thẳng theo hành trình.[cite: 1]", "C. Rà phanh giảm tốc và tăng khoảng cách an toàn với xe khách để tránh bị ép.[cite: 1]", "D. Bấm còi liên tục để phản đối hành vi chuyển làn không quan sát của xe khách.[cite: 1]"], a: 2 },
            { q: "Câu 5: Gương chiếu hậu cho thấy một chiếc xe tải phía sau đang tăng tốc nhanh và bắt đầu lấn sang làn đường của bạn để thực hiện việc vượt lên. Phương án xử lý của bạn là:[cite: 1]", o: ["A. Tăng tốc độ để đua với xe tải, không cho phép họ vượt.[cite: 1]", "B. Đánh lái sang trái chiếm làn đường để xe tải không thể vượt.[cite: 1]", "C. Chủ động giảm tốc độ, giữ khoảng cách an toàn và quan sát kỹ tình hình.[cite: 1]", "D. Phanh gấp đột ngột để làm xe tải giật mình và không dám vượt nữa.[cite: 1]"], a: 2 },
            { q: "Câu 6: Bạn phát hiện một vật cản nằm giữa làn đường và chiếc xe tải phía trước đang đánh lái gấp sang làn bạn để tránh. Phương án xử lý của bạn là:[cite: 1]", o: ["A. Hạ tốc độ, giữ khoảng cách an toàn để nhường đường cho xe tải.[cite: 1]", "B. Đánh lái để cùng vượt vật cản đồng thời với xe tải.[cite: 1]", "C. Bám sát đuôi xe tải để tránh vật cản theo lộ trình của họ.[cite: 1]", "D. Phanh gấp, dừng ngay lập tức khi thấy xe tải bắt đầu đánh lái sang.[cite: 1]"], a: 0 },
            { q: "Câu 7: Bạn đang lái xe qua một đoạn đường cong dốc vào ban đêm, không có đèn đường và tầm nhìn bị hạn chế bởi bóng tối bao trùm phía trước. Phương án xử lý của bạn là:[cite: 1]", o: ["A. Bật đèn pha để tăng tầm nhìn và tăng tốc tiếp tục hành trình.[cite: 1]", "B. Giảm tốc độ, giữ khoảng cách an toàn và bật tín hiệu cảnh báo nếu cần thiết.[cite: 1]", "C. Giữ nguyên tốc độ và bám sát theo vạch kẻ đường ở giữa dải phân cách.[cite: 1]", "D. Phanh gấp mỗi khi bạn cảm thấy có bóng đen xuất hiện phía trước.[cite: 1]"], a: 1 },
            { q: "Câu 8: Trong khu dân cư, bạn thấy một nhóm học sinh đang đứng trên vỉa hè và một đứa trẻ bắt đầu bước xuống lòng đường để chạy sang phía đối diện. Phương án xử lý của bạn là:[cite: 1]", o: ["A. Tăng tốc độ để đứa trẻ phải dừng lại nhường đường cho xe ô tô của bạn.[cite: 1]", "B. Nhấn còi liên tục để cảnh báo và giữ nguyên tốc độ để duy trì lưu thông.[cite: 1]", "C. Giảm tốc độ, giữ khoảng cách an toàn và chủ động nhường đường cho người đi bộ.[cite: 1]", "D. Phanh gấp và đánh lái bám sát vào lề đường để tránh đứa trẻ.[cite: 1]"], a: 2 },
            { q: "Câu 9: Chiếc xe con phía trước giảm tốc độ rõ rệt khi gần đến điểm mở dải phân cách và bắt đầu đánh hết lái để thực hiện việc quay đầu. Phương án xử lý của bạn là:[cite: 1]", o: ["A. Đánh lái và nhấn ga tăng tốc để lách qua làn khác để vượt qua.[cite: 1]", "B. Nhấn còi thật mạnh và dài để xe đó cho xe mình quay đầu trước.[cite: 1]", "C. Bám sát vào xe phía trước để thực hiện quay đầu cùng nhau.[cite: 1]", "D. Hạ tốc độ, giữ khoảng cách an toàn và kiên nhẫn quan sát quá trình quay đầu.[cite: 1]"], a: 3 },
            { q: "Câu 10: Tầm nhìn phía trước của bạn bị một chiếc xe khách lớn chắn hoàn toàn, bạn không thể nhìn thấy đèn tín hiệu hay tình hình giao thông phía trước xe đó. Phương án xử lý của bạn là:[cite: 1]", o: ["A. Nhấn ga tăng tốc để vượt qua xe khách nhằm lấy lại tầm nhìn bao quát.[cite: 1]", "B. Giảm tốc độ, tăng khoảng cách an toàn và chú ý quan sát hai bên xe khách.[cite: 1]", "C. Bám thật sát vào đuôi xe khách để tận dụng lực hút gió giúp xe chạy nhẹ hơn.[cite: 1]", "D. Phanh gấp dừng lại một khoảng cách đủ xa để tránh va chạm.[cite: 1]"], a: 1 }
        ],
        "4": [
            { q: "Câu 1: Bạn đang lái xe vào một đoạn đường hẹp, vừa lúc đó ở phía đối diện có một xe khác cũng đang tiến vào, khiến không gian còn lại không đủ để hai xe tránh nhau một cách thoải mái. Phương án xử lý của bạn là:[cite: 1]", o: ["A. Nhấn ga tăng tốc để chiếm đường đi trước, buộc xe đối diện phải dừng lại.[cite: 1]", "B. Giảm tốc độ về mức an toàn, chủ động nhường đường nếu cần thiết để tránh xung đột giao thông.[cite: 1]", "C. Giữ nguyên tốc độ và đi sát vào giữa đường để ép xe đối diện phải lùi lại.[cite: 1]", "D. Phanh gấp, dừng hẳn xe lại chờ xe đối diện đi qua.[cite: 1]"], a: 1 },
            { q: "Câu 2: Bạn đang lái xe vào một đoạn đường hẹp, vừa lúc đó ở phía đối diện có một xe khác cũng đang tiến vào, khiến không gian còn lại không đủ để hai xe tránh nhau một cách thoải mái. Phương án xử lý của bạn là:[cite: 1]", o: ["A. Nhấn ga tăng tốc để chiếm đường đi trước, buộc xe đối diện phải dừng lại.[cite: 1]", "B. Phanh gấp, dừng hẳn xe lại chờ xe đối diện đi qua.[cite: 1]", "C. Giữ nguyên tốc độ và đi sát vào giữa đường để ép xe đối diện phải lùi lại.[cite: 1]", "D. Giảm tốc độ về mức an toàn, chủ động nhường đường nếu cần thiết để tránh xung đột giao thông.[cite: 1]"], a: 3 },
            { q: "Câu 3: Xe vệ sinh môi trường đang dừng làm việc giữa đường, có nhân viên đang đi lại xung quanh để thu gom rác khiến xe phía trước bạn phải chuyển làn đột ngột. Phương án xử lý của bạn là:[cite: 1]", o: ["A. Tăng tốc để vượt qua cả xe phía trước lẫn xe môi trường.[cite: 1]", "B. Bấm còi để nhân viên môi trường phải nhanh chóng dẹp vào lề.[cite: 1]", "C. Giảm tốc độ và giữ khoảng cách an toàn để tránh các tình huống va chạm bất ngờ.[cite: 1]", "D. Phanh gấp ngay khi thấy xe phía trước bật xi nhan chuyển làn.[cite: 1]"], a: 2 },
            { q: "Câu 4: Một chiếc xe khách chạy tuyến cố định từ phía sau đang liên tục nháy đèn, bấm còi và bắt đầu lấn hẳn sang làn của bạn để tìm cách vượt lên. Phương án xử lý của bạn là:[cite: 1]", o: ["A. Tăng tốc độ không cho xe khách vượt ẩu.[cite: 1]", "B. Đánh lái sang trái để chặn đường, không cho xe khách có khe hở để vượt.[cite: 1]", "C. Chủ động giảm tốc độ nhẹ, giữ hướng xe ổn định để xe khách vượt qua an toàn.[cite: 1]", "D. Phanh gấp đột ngột để cảnh cáo tài xế xe khách phía sau.[cite: 1]"], a: 2 },
            { q: "Câu 5: Trên đoạn đường hẹp, chiếc xe con phía trước bất ngờ tăng tốc và lấn hẳn sang làn ngược chiều để vượt ẩu một xe tải khác. Phương án xử lý của bạn là:[cite: 1]", o: ["A. Hạ tốc độ, giữ khoảng cách an toàn và kiên trì đi đúng phần đường của mình.[cite: 1]", "B. Bấm còi liên tục để cảnh báo các xe đi ngược chiều thay cho xe con.[cite: 1]", "C. Nhấn ga tăng tốc để bám theo xe con cùng thực hiện pha vượt ẩu.[cite: 1]", "D. Phanh gấp, dừng ngay để tránh xa hiện trường.[cite: 1]"], a: 0 },
            { q: "Câu 6: Tại đoạn đường có làn nhập, bạn thấy một chiếc xe tải từ đường nhánh đang bắt đầu tăng tốc để đi vào làn chính ngay phía trước đầu xe bạn. Phương án xử lý của bạn là:[cite: 1]", o: ["A. Nhấn ga để vượt qua trước khi xe tải nhập vào làn chính.[cite: 1]", "B. Chủ động giảm tốc độ và duy trì khoảng cách an toàn cho xe tải nhập làn.[cite: 1]", "C. Bám sát đuôi xe phía trước để không cho xe tải có cơ hội nhập làn.[cite: 1]", "D. Phanh gấp để chờ xe tải đi qua.[cite: 1]"], a: 1 },
            { q: "Câu 7: Khi đang di chuyển trên cung đường đèo núi quanh co với một bên là vực sâu, bất ngờ một chiếc xe tải đối diện xuất hiện ở khúc cua hẹp. Phương án xử lý của bạn là:[cite: 1]", o: ["A. Nhấn ga để nhanh chóng thoát khỏi khúc cua nguy hiểm này.[cite: 1]", "B. Hạ tốc độ, giữ khoảng cách an toàn và đi sát về phía phần đường bên phải.[cite: 1]", "C. Đánh lái sát sang làn đường đối diện để mở rộng góc cua cho dễ quan sát.[cite: 1]", "D. Phanh gấp ngay khi thấy xe tải để tránh va chạm trực diện.[cite: 1]"], a: 1 },
            { q: "Câu 8: Bạn phát hiện một người đi xe đạp đang ở sát mép đường phía trước, bất ngờ người này loạng choạng và đi xuống lòng đường để chuẩn bị sang ngang. Phương án xử lý của bạn là:[cite: 1]", o: ["A. Nhấn ga tăng tốc để đi qua trước khi người xe đạp chiếm phần đường của bạn.[cite: 1]", "B. Phanh gấp ngay sát người đi xe đạp và đợi các xe đi qua.[cite: 1]", "C. Bấm còi để người đi xe đạp giật mình mà quay lại sát lề.[cite: 1]", "D. Hạ tốc độ, giữ khoảng cách an toàn và chú ý quan sát kỹ hướng di chuyển.[cite: 1]"], a: 3 },
            { q: "Câu 9: Xe phía trước có dấu hiệu dạt dần sang trái, đồng thời tài xế bật tín hiệu xi nhan trái để chuẩn bị thực hiện thao tác chuyển hướng. Phương án xử lý của bạn là:[cite: 1]", o: ["A. Nhấn ga để vượt qua phía bên trái của chiếc xe đang rẽ đó.[cite: 1]", "B. Chủ động giảm tốc độ và duy trì khoảng cách an toàn với xe phía trước.[cite: 1]", "C. Bấm còi liên tục để yêu cầu xe đó phải dừng lại nhường đường cho bạn đi thẳng.[cite: 1]", "D. Phanh gấp để xe phía trước thực hiện thao tác rẽ xong mới di chuyển.[cite: 1]"], a: 1 },
            { q: "Câu 10: Xe phía trước vừa dừng lại, cánh cửa xe bất ngờ mở toang và có người đang loay hoay chuẩn bị bước xuống lòng đường ngay trước mũi xe bạn. Phương án xử lý của bạn là:[cite: 1]", o: ["A. Đánh lái và tăng tốc để lách qua trước khi người đó kịp bước xuống hẳn.[cite: 1]", "B. Hạ tốc độ, duy trì khoảng cách an toàn và sẵn sàng dừng xe nhường đường.[cite: 1]", "C. Bấm còi thật mạnh để người trong xe biết mà đóng cửa lại ngay lập tức.[cite: 1]", "D. Phanh gấp ngay sát cạnh cánh cửa đang mở để cảnh cáo tài xế.[cite: 1]"], a: 1 }
        ],
        "5": [
            { q: "Câu 1: Một người điều khiển xe máy đi phía trước đang bám sát vạch phân làn và có biểu hiện tay lái không ổn định, liên tục chao đảo. Bất ngờ, xe máy này đột ngột lấn sang làn đường của bạn mà không có tín hiệu xi nhan. Phương án xử lý của bạn là:[cite: 1]", o: ["A. Tăng tốc để vượt qua xe máy nhằm tránh rắc rối.[cite: 1]", "B. Giữ nguyên tốc độ, áp sát xe máy và bấm còi để nhắc nhở tài xế đi đúng làn.[cite: 1]", "C. Chủ động giảm tốc độ, giữ khoảng cách an toàn và hơi lệch sang phía an toàn để tránh va chạm.[cite: 1]", "D. Phanh gấp ngay lập tức chờ xe máy đi qua.[cite: 1]"], a: 2 },
            { q: "Câu 2: Tại một giao lộ phía bên trái bị che khuất tầm nhìn bởi cây cối, bạn thấy đầu một chiếc xe từ đường nhánh đang nhô ra và tiến rất gần vào phần đường chính bạn đang đi. Phương án xử lý của bạn là:[cite: 1]", o: ["A. Tăng tốc để nhanh chóng thoát khỏi khu vực giao lộ.[cite: 1]", "B. Giảm tốc độ, quan sát kỹ vào phía trong đường nhánh và sẵn sàng dừng xe.[cite: 1]", "C. Bấm còi hối thúc liên tục để xe từ đường nhánh phải dừng lại nhường đường.[cite: 1]", "D. Bám sát vào đuôi xe đi trước để cùng nhau vượt qua giao lộ.[cite: 1]"], a: 1 },
            { q: "Câu 3: Bạn đang dừng xe chờ đèn đỏ tại một giao lộ. Ngay khi đèn tín hiệu giao thông vừa chuyển sang màu xanh, bạn quan sát thấy vẫn còn phương tiện chưa thoát hết khỏi giao lộ. Phương án xử lý của bạn là:[cite: 1]", o: ["A. Không di chuyển ngay, quan sát kỹ an toàn hai bên rồi mới từ từ tăng tốc.[cite: 1]", "B. Bấm còi liên tục để hối thúc các xe phía trước di chuyển nhanh hơn.[cite: 1]", "C. Nhấn ga tăng tốc để bắt kịp nhịp giao thông và không làm xe sau khó chịu.[cite: 1]", "D. Chậm rãi đi giao lộ an toàn mặc kệ các xe phía sau bấm còi nhắc nhở.[cite: 1]"], a: 0 },
            { q: "Câu 4: Tại đoạn đường nông thôn có nhiều ngõ nhỏ khuất tầm nhìn, bạn phát hiện một chiếc xe máy lao ra từ ngõ với tốc độ cao mà không hề giảm tốc độ. Phương án xử lý của bạn là:[cite: 1]", o: ["A. Tăng tốc để lướt qua nhanh trước khi xe máy kịp chiếm phần đường của bạn.[cite: 1]", "B. Giữ nguyên tốc độ và bấm còi mạnh để xe máy phải tự hãm phanh.[cite: 1]", "C. Luôn chú ý quan sát hai bên ngõ nhỏ và chủ động giảm tốc độ từ xa.[cite: 1]", "D. Phanh gấp để dừng lại chờ xe máy đi qua.[cite: 1]"], a: 2 },
            { q: "Câu 5: Xe phía sau liên tục nháy đèn và bật tín hiệu xin vượt tại đoạn đường đủ điều kiện an toàn và xe đó đã tiến rất sát đuôi xe bạn. Phương án xử lý của bạn là:[cite: 1]", o: ["A. Tăng tốc độ để giữ khoảng cách, không cho xe sau vượt.[cite: 1]", "B. Hạ tốc độ, giữ khoảng cách an toàn phía trước và quan sát gương để nhường.[cite: 1]", "C. Bấm còi và nháy đèn hậu để phát tín hiệu từ chối cho vượt.[cite: 1]", "D. Đánh lái liên tục từ trái sang phải để chắn hướng vượt của xe sau.[cite: 1]"], a: 1 },
            { q: "Câu 6: Xe con phía sau áp sát đuôi xe bạn và liên tục nháy đèn xi nhan trái để xin đường vượt lên trên đoạn đường cho phép. Phương án xử lý của bạn là:[cite: 1]", o: ["A. Tăng tốc độ nhanh hơn và không cần phải nhường.[cite: 1]", "B. Giảm tốc độ nhẹ, giữ khoảng cách an toàn và quan sát gương để nhường đường.[cite: 1]", "C. Nháy đèn phanh liên tục để phát tín hiệu từ chối không cho vượt.[cite: 1]", "D. Đánh lái sang trái để xe con phía sau vượt.[cite: 1]"], a: 1 },
            { q: "Câu 7: Bạn đang đi sau một chiếc xe tải chở sắt thép cồng kềnh, bất ngờ một thanh sắt bị tuột dây chằng và rơi thẳng xuống mặt đường ngay trước xe bạn. Phương án xử lý của bạn là:[cite: 1]", o: ["A. Bấm còi liên tục để cảnh báo cho xe tải.[cite: 1]", "B. Phanh gấp khi thấy thanh sắt rơi, tránh xa để tránh các vật rơi tiếp theo.[cite: 1]", "C. Đánh lái gấp sang làn bên trái ở tốc độ cao để né tránh thanh sắt vừa rơi.[cite: 1]", "D. Lập tức giảm tốc độ, giữ khoảng cách an toàn và quan sát để tránh vật cản.[cite: 1]"], a: 3 },
            { q: "Câu 8: Trong khu dân cư, bạn thấy một nhóm học sinh đang đứng trên vỉa hè và một đứa trẻ bắt đầu bước xuống lòng đường để chạy sang phía đối diện. Phương án xử lý của bạn là:[cite: 1]", o: ["A. Tăng tốc độ để đứa trẻ phải dừng lại nhường đường cho xe ô tô của bạn.[cite: 1]", "B. Nhấn còi liên tục để cảnh báo và giữ nguyên tốc độ để duy trì lưu thông.[cite: 1]", "C. Giảm tốc độ, giữ khoảng cách an toàn và chủ động nhường đường cho người đi bộ.[cite: 1]", "D. Phanh gấp và đánh lái bám sát vào lề đường để tránh đứa trẻ.[cite: 1]"], a: 2 },
            { q: "Câu 9: Chiếc xe con phía trước giảm tốc độ rõ rệt khi gần đến điểm mở dải phân cách và bắt đầu đánh hết lái để thực hiện việc quay đầu. Phương án xử lý của bạn là:[cite: 1]", o: ["A. Đánh lái và nhấn ga tăng tốc để lách qua làn khác để vượt qua.[cite: 1]", "B. Nhấn còi thật mạnh và dài để xe đó cho xe mình quay đầu trước.[cite: 1]", "C. Bám sát vào xe phía trước để thực hiện quay đầu cùng nhau.[cite: 1]", "D. Hạ tốc độ, giữ khoảng cách an toàn và kiên nhẫn quan sát quá trình quay đầu.[cite: 1]"], a: 3 },
            { q: "Câu 10: Tại đoạn đường đô thị có nhiều ngõ nhỏ, chiếc xe phía trước giảm tốc độ sâu và bắt đầu bật xi nhan để chuẩn bị rẽ vào một con ngõ hẹp. Phương án xử lý của bạn là:[cite: 1]", o: ["A. Nhấn ga tăng tốc để ép xe đó và vượt qua trước khi họ kịp đánh lái rẽ vào ngõ.[cite: 1]", "B. Giảm tốc độ, giữ khoảng cách an toàn và kiên nhẫn chờ xe trước rẽ xong.[cite: 1]", "C. Bấm còi liên tục hối thúc tài xế thực hiện rẽ nhanh hơn.[cite: 1]", "D. Phanh gấp đột ngột khi xe trước bật xi nhan và chờ đợi họ rẽ.[cite: 1]"], a: 1 }
        ],
        "6": [
            { q: "Câu 1: Thông qua gương chiếu hậu, bạn quan sát thấy một chiếc xe buýt phía sau đang tăng tốc nhanh và bám sát đuôi xe bạn. Ngay sau đó, tài xế xe buýt lấn dần sang làn đường của bạn để tìm cách vượt lên trong không gian hẹp. Phương án xử lý của bạn là:[cite: 1]", o: ["A. Tăng tốc độ để ngăn cản, không cho xe buýt có cơ hội vượt qua.[cite: 1]", "B. Giảm tốc độ nhẹ để tạo khoảng trống an toàn, giữ vững hướng lái và chú ý quan sát gương.[cite: 1]", "C. Đánh lái liên tục từ trái sang phải để chặn hướng tiến của xe buýt.[cite: 1]", "D. Đạp phanh nhấp nhả để buộc xe buýt phía sau phải đi chậm lại.[cite: 1]"], a: 1 },
            { q: "Câu 2: Qua gương chiếu hậu, bạn thấy một chiếc xe buýt phía sau đang lao tới với tốc độ cao, lấn sang làn đường ngược chiều để vượt xe bạn trong khi có xe đi đối diện đang đến gần. Phương án xử lý của bạn là:[cite: 1]", o: ["A. Nhấn ga tăng tốc để không cho xe buýt có cơ hội vượt lên.[cite: 1]", "B. Đánh lái sang trái để ép xe buýt không được lấn làn vượt ẩu.[cite: 1]", "C. Chủ động giảm tốc độ để tránh tình huống đối đầu trực diện, giữ hướng xe ổn định.[cite: 1]", "D. Phanh gấp ngay giữa đường để phản đối hành vi của xe buýt.[cite: 1]"], a: 2 },
            { q: "Câu 3: Xuất hiện biển cảnh báo đoạn đường trơn trượt do trời mưa, bạn thấy mặt đường có vẻ bóng loáng và xe đi trước đang có dấu hiệu sàng đuôi khi rà phanh. Phương án xử lý của bạn là:[cite: 1]", o: ["A. Tăng tốc độ để nhanh chóng thoát khỏi đoạn đường nguy hiểm này.[cite: 1]", "B. Đạp phanh thật mạnh mỗi khi cảm thấy xe có dấu hiệu không bám đường.[cite: 1]", "C. Bám sát vào vết bánh xe của phương tiện đi trước để tăng độ bám.[cite: 1]", "D. Hạ ga từ sớm, tuyệt đối không phanh gấp và duy trì khoảng cách an toàn lớn hơn.[cite: 1]"], a: 3 },
            { q: "Câu 4: Trong khu dân cư, bạn thấy một người đi xe đạp từ trong ngõ nhỏ từ từ đi ra đường chính nhưng mặt lại ngoảnh đi hướng khác, thiếu quan sát phương tiện. Phương án xử lý của bạn là:[cite: 1]", o: ["A. Giữ nguyên tốc độ vì xe đạp từ đường không ưu tiên phải nhường bạn.[cite: 1]", "B. Chủ động giảm tốc độ sâu vì người đi xe đạp thường khó kiểm soát tay lái.[cite: 1]", "C. Tăng tốc và bấm còi liên tục để người xe đạp giật mình mà dừng lại.[cite: 1]", "D. Đánh lái gấp sang làn đường đối diện để tránh người đi xe đạp.[cite: 1]"], a: 1 },
            { q: "Câu 5: Bạn nghe thấy tiếng còi hú ưu tiên dồn dập và quan sát thấy một chiếc xe cứu thương đang tiến đến rất gần từ phía sau. Phương án xử lý của bạn là:[cite: 1]", o: ["A. Tăng tốc để dẫn đường cho xe cứu thương đi qua đám đông.[cite: 1]", "B. Giữ nguyên tốc độ và làn đường hiện tại để tránh gây lộn xộn.[cite: 1]", "C. Hạ tốc độ, bật tín hiệu cảnh báo và chủ động nhường đường theo đúng luật.[cite: 1]", "D. Phanh gấp để xe cứu thương có thể đi qua ngay.[cite: 1]"], a: 2 },
            { q: "Câu 6: Bạn đang di chuyển vào đoạn đường đang thi công có biển bảo từ xa và bắt đầu thấy các rào chắn bằng tôn hoặc cọc tiêu phản quang. Phương án xử lý của bạn là:[cite: 1]", o: ["A. Nhấn ga tăng tốc để nhanh chóng đi qua đoạn đường đầy bụi và vật cản.[cite: 1]", "B. Hạ tốc độ, giữ khoảng cách an toàn và tuân thủ đúng các biển hướng dẫn.[cite: 1]", "C. Đánh lái để lách qua các rào chắn với tốc độ nhanh để tiếp tục hành trình.[cite: 1]", "D. Phanh gấp giữa đường ngay khi thấy bóng dáng công nhân đang làm việc.[cite: 1]"], a: 1 },
            { q: "Câu 7: Tại khu vực đồi núi, bạn phát hiện một đàn dê đang đứng gặm cỏ sát mép đường và có một vài con đang có ý định nhảy xổ ra lòng đường. Phương án xử lý của bạn là:[cite: 1]", o: ["A. Hạ tốc độ từ xa, giữ khoảng cách an toàn và sẵn sàng xử lý nếu dê lao ra.[cite: 1]", "B. Tăng tốc để nhanh chóng đi qua khu vực đàn dê đang đứng.[cite: 1]", "C. Bấm còi dồn dập để đàn dê hoảng sợ mà chạy vào rừng.[cite: 1]", "D. Bám sát vào lề đường, không cho đàn dê có thể xổ ra đường.[cite: 1]"], a: 0 },
            { q: "Câu 8: Một đứa trẻ bất ngờ từ sau một chiếc xe tải đang đỗ chạy vụt ra lòng đường để nhặt bóng khi xe bạn chỉ còn cách vài mét. Phương án xử lý của bạn là:[cite: 1]", o: ["A. Nhấn ga tăng tốc để lách nhanh qua trước mặt đứa trẻ.[cite: 1]", "B. Lập tức giảm tốc độ, giữ khoảng cách an toàn và sẵn sàng phanh dừng khẩn cấp.[cite: 1]", "C. Bấm còi thật mạnh để đứa trẻ biết và không di chuyển tiếp.[cite: 1]", "D. Đánh lái gấp sang làn đường ngược chiều mà không cần quan sát gương.[cite: 1]"], a: 1 },
            { q: "Câu 9: Một chiếc xe taxi đang chạy lừ đừ sát lề đường bên phải, bất ngờ tài xế phanh gấp đột ngột để kịp đón một vị khách đang vẫy xe trên vỉa hè. Phương án xử lý của bạn là:[cite: 1]", o: ["A. Nhấn ga tăng tốc và đánh lái qua làn khác để vượt qua taxi ngay khi đèn phanh sáng.[cite: 1]", "B. Bám sát xe taxi và nhấn còi liên tục để phản đối hành vi dừng xe.[cite: 1]", "C. Giảm tốc độ, giữ khoảng cách an toàn và chú ý quan sát hành khách lên xe.[cite: 1]", "D. Phanh gấp ngay phía sau đuôi taxi và dừng lại đó chờ đợi.[cite: 1]"], a: 2 },
            { q: "Câu 10: Xe phía trước phát hiện có người già đang chuẩn bị băng qua đường và tài xế bắt đầu rà phanh để thực hiện việc nhường đường. Phương án xử lý của bạn là:[cite: 1]", o: ["A. Nhấn ga tăng tốc để vượt qua cả xe phía trước lẫn người đi bộ đang sang đường.[cite: 1]", "B. Bấm còi thật to để người đi bộ phải lùi lại nhường cho xe của bạn đi trước.[cite: 1]", "C. Hạ tốc độ, duy trì khoảng cách an toàn và cùng nhường đường cho người đi bộ.[cite: 1]", "D. Phanh gấp ngay sát đuôi xe phía trước để thể hiện sự đồng tình nhường đường.[cite: 1]"], a: 2 }
        ],
        "7": [
            { q: "Câu 1: Tại đoạn đường có một ngõ khuất bên phải, bạn phát hiện bóng một người đi xe đạp đang lao ra từ ngõ với tốc độ khá nhanh mà không có dấu hiệu quan sát đường chính. Phương án xử lý của bạn là:[cite: 1]", o: ["A. Tăng tốc để vượt qua điểm giao cắt trước khi xe đạp lao ra.[cite: 1]", "B. Giữ nguyên tốc độ và bấm còi liên tục để người xe đạp nhường đường.[cite: 1]", "C. Quan sát hai bên, chủ động giảm tốc độ sâu và giữ khoảng cách phòng ngừa va chạm ngang.[cite: 1]", "D. Đánh lái gấp sang làn ngược chiều để tránh người đi xe đạp.[cite: 1]"], a: 2 },
            { q: "Câu 2: Bạn đang lái xe trên phố và phát hiện một chiếc xe con đang đỗ sát lề đường bên phải. Khi xe bạn vừa tiến đến gần, cánh cửa phía lái của chiếc xe đỏ bất ngờ mở ra. Phương án xử lý của bạn là:[cite: 1]", o: ["A. Tăng tốc độ để lướt qua thật nhanh trước khi cánh cửa mở rộng hoàn toàn.[cite: 1]", "B. Giữ nguyên tốc độ, đi sát vào cửa xe và bấm còi để cảnh báo người trong xe.[cite: 1]", "C. Duy trì khoảng cách thân xe rộng với hàng xe đang đỗ và chủ động giảm tốc độ khi đi qua.[cite: 1]", "D. Phanh gấp và dừng chờ xe đóng cửa rồi mới đi qua.[cite: 1]"], a: 2 },
            { q: "Câu 3: Đoạn đường phía trước bị xuống cấp nghiêm trọng với nhiều ổ gà, ổ voi. Chiếc xe phía trước đang phải liên tục phanh và đánh lái ngoằn ngoèo để né tránh các hố sâu. Phương án xử lý của bạn là:[cite: 1]", o: ["A. Đánh lái theo xe phía trước để vượt qua đoạn đường xấu.[cite: 1]", "B. Chủ động hạ tốc độ và giữ hướng lái thẳng ổn định, tránh các pha đánh lái đột ngột.[cite: 1]", "C. Nhấn ga để lướt qua các ổ gà thật nhanh nhằm giảm độ rung chấn cho xe.[cite: 1]", "D. Bám sát đuôi xe phía trước để đi qua đường xấu.[cite: 1]"], a: 1 },
            { q: "Câu 4: Bạn đang di chuyển sau một chiếc xe tải lớn che khuất tầm nhìn, bất ngờ một chiếc xe máy chui tọt ra từ phía sau đuôi xe tải và lấn thắng sang làn đường của bạn. Phương án xử lý của bạn là:[cite: 1]", o: ["A. Bám sát đuôi xe tải để không tạo khoảng trống cho xe máy lách vào.[cite: 1]", "B. Tăng tốc để xe máy phải quay trở lại phía sau xe tải.[cite: 1]", "C. Phanh gấp ngay khi thấy bóng dáng xe máy bắt đầu nhô ra.[cite: 1]", "D. Giữ khoảng cách lớn với xe tải, hạ tốc độ và sẵn sàng xử lý tình huống bất ngờ.[cite: 1]"], a: 3 },
            { q: "Câu 5: Chiếc xe đi ngay phía trước đang bám sát vạch kẻ đường và bắt đầu có dấu hiệu lấn dần sang làn đường bạn đang di chuyển. Phương án xử lý của bạn là:[cite: 1]", o: ["A. Tăng tốc để chiếm chỗ trống, không cho xe phía trước nhập làn thành công.[cite: 1]", "B. Chủ động giảm tốc độ và duy trì khoảng cách an toàn với xe đó.[cite: 1]", "C. Giữ tốc độ và bám thật sát xe phía trước để thu hẹp tối đa khoảng trống nhập làn.[cite: 1]", "D. Nhấn còi liên tục và giữ nguyên tốc độ để khẳng định quyền ưu tiên.[cite: 1]"], a: 1 },
            { q: "Câu 6: Tiếp tục hành trình qua khu vực công trường dài, chiếc xe phía trước đang di chuyển rất chậm do mặt đường bị thu hẹp đáng kể. Phương án xử lý của bạn là:[cite: 1]", o: ["A. Kiên nhẫn giảm tốc độ và giữ khoảng cách an toàn tuyệt đối với xe đi trước.[cite: 1]", "B. Nhấn ga tăng tốc và tìm cách vượt xe phía trước ngay trong phạm vi công trường.[cite: 1]", "C. Bấm còi liên tục để thúc giục tài xế phía trước di chuyển nhanh hơn.[cite: 1]", "D. Bám sát đuôi xe trước, không để bất kỳ khoảng trống nào cho xe khác chen vào.[cite: 1]"], a: 0 },
            { q: "Câu 7: Bạn lái xe đi vào một vùng có màn sương mù dày đặc, tầm nhìn giảm xuống dưới 20m, ánh đèn của xe phía trước chỉ còn là những đốm mờ nhạt. Phương án xử lý của bạn là:[cite: 1]", o: ["A. Nhấn ga tăng tốc để mau chóng thoát khỏi vùng sương mù khó chịu này.[cite: 1]", "B. Giảm tốc độ sâu, giữ khoảng cách an toàn tối đa và bật đèn sương mù, đèn cảnh báo.[cite: 1]", "C. Tắt đèn xe để tránh hiện tượng phản xạ ánh sáng từ màn sương vào mắt.[cite: 1]", "D. Phanh gấp và dừng xe giữa đường để đợi đến khi sương mù tan hết.[cite: 1]"], a: 1 },
            { q: "Câu 8: Tại một điểm giao cắt nhỏ, một chiếc xe con bất ngờ phóng từ đường nhánh ra và băng ngang qua đường chính ngay trước tầm mắt bạn. Phương án xử lý của bạn là:[cite: 1]", o: ["A. Nhấn ga tăng tốc để xe con phải dừng lại nhường đường.[cite: 1]", "B. Hạ tốc độ, giữ khoảng cách an toàn và sẵn sàng xử lý va chạm.[cite: 1]", "C. Bám sát vào sau xe con và nhấn còi để thể hiện sự bực bội.[cite: 1]", "D. Phanh gấp hết sức để dừng xe lại và hi vọng không có va chạm.[cite: 1]"], a: 1 },
            { q: "Câu 9: Một chiếc xe công nghệ đang di chuyển lúng túng do tài xế nhìn bản đồ, rồi bất ngờ dừng lại giữa đường để trả khách mà không vào sát lề. Phương án xử lý của bạn là:[cite: 1]", o: ["A. Nhấn ga tăng tốc và đánh lái sang làn bên trái để vượt qua.[cite: 1]", "B. Phanh gấp dừng lại nhường đường cho xe công nghệ đi xa hẳn.[cite: 1]", "C. Bấm còi dồn dập nhắc nhở tài xế tập trung di chuyển.[cite: 1]", "D. Chủ động giảm tốc độ, giữ khoảng cách an toàn và quan sát xung quanh.[cite: 1]"], a: 3 },
            { q: "Câu 10: Trong điều kiện giao thông giờ cao điểm đông đúc, chiếc xe phía trước phải đánh lái gấp sang làn bạn để tránh một xe máy đang di chuyển ngược chiều. Phương án xử lý của bạn là:[cite: 1]", o: ["A. Đánh lái và tăng tốc để chen vào khoảng trống trước khi xe đó kịp sang làn.[cite: 1]", "B. Chủ động giảm tốc độ, giữ khoảng cách an toàn để xe phía trước né tránh.[cite: 1]", "C. Bám sát đuôi xe phía trước, không để bất kỳ xe nào chen vào.[cite: 1]", "D. Bấm còi liên tục và kiên quyết giữ vững chân ga không đạp phanh.[cite: 1]"], a: 1 }
        ],
        "8": [
            { q: "Câu 1: Một chiếc xe con phía trước đang di chuyển không ổn định, tài xế bất ngờ nhấn ga tăng tốc và lấn sang phần đường ngược chiều để cố gắng vượt một xe khác tại đoạn đường không an toàn. Phương án xử lý của bạn là:[cite: 1]", o: ["A. Tăng tốc bám theo để cùng vượt với xe phía trước.[cite: 1]", "B. Không tăng tốc theo, giảm ga và giữ khoảng cách an toàn để tránh va chạm dồn xe.[cite: 1]", "C. Nháy đèn pha và bấm còi để xe phía nhanh chóng hoàn thành việc vượt.[cite: 1]", "D. Phanh gấp và tránh xa để giữ an toàn tuyệt đối với xe đang vượt ẩu.[cite: 1]"], a: 1 },
            { q: "Câu 2: Quan sát phía bên kia đường (chiều ngược lại), bạn thấy một chiếc xe đang đỗ nhưng có ánh đèn xi nhan hoặc chuyển động rung rinh bảo hiệu có người chuẩn bị mở cửa hoặc bước ra đường. Phương án xử lý của bạn là:[cite: 1]", o: ["A. Tập trung nhìn vào khoảng trống phía trước xe mình.[cite: 1]", "B. Tăng tốc độ để nhanh chóng đi qua đoạn đường có xe đỗ đó.[cite: 1]", "C. Quan sát đa chiều cả hai phía, chủ động hạ tốc độ đề phòng cửa mở hoặc người băng qua đường.[cite: 1]", "D. Bấm còi để cảnh báo người ở chiếc xe bên kia đường.[cite: 1]"], a: 2 },
            { q: "Câu 3: Khi đang di chuyển qua khu vực đường nông thôn không có rào chắn, bạn phát hiện một con bò đang đứng thong dong ngay giữa phần đường dành cho xe chạy. Phương án xử lý của bạn là:[cite: 1]", o: ["A. Bấm còi liên tục để con bỏ sợ hãi mà chạy khỏi đường.[cite: 1]", "B. Giữ nguyên tốc độ và đánh lái vòng qua con bò với khoảng cách hẹp.[cite: 1]", "C. Giảm tốc độ sâu, có thể bấm còi nhẹ để cảnh báo động vật tránh ra.[cite: 1]", "D. Phanh gấp và dừng xe lại ngay sát vị trí con bò đang đứng.[cite: 1]"], a: 2 },
            { q: "Câu 4: Tại một giao lộ rộng không có đèn tín hiệu, một chiếc xe tải chở hàng nặng đang từ từ băng ngang qua đường ngay trước tầm mắt bạn. Phương án xử lý của bạn là:[cite: 1]", o: ["A. Giảm tốc độ và chủ động nhường đường vì xe lớn chở nặng rất khó dừng gấp.[cite: 1]", "B. Nhấn ga tăng tốc để cố gắng lách qua trước đầu xe tải.[cite: 1]", "C. Bấm còi liên tục yêu cầu xe tải phải dừng lại ngay giữa giao lộ.[cite: 1]", "D. Bám sát vào phía đuôi xe tải để tranh thủ đi qua giao lộ.[cite: 1]"], a: 0 },
            { q: "Câu 5: Một chiếc xe tải lớn đang di chuyển song song ở làn bên cạnh bắt đầu lấn sang một phần làn đường của bạn để tránh chướng ngại vật phía trước. Phương án xử lý của bạn là:[cite: 1]", o: ["A. Nhấn ga tăng tốc để vượt qua xe tải thật nhanh trước khi bị ép làn.[cite: 1]", "B. Giảm tốc độ, giữ khoảng cách an toàn để tránh va chạm với thân xe tải.[cite: 1]", "C. Đi song song sát cạnh xe tải và bấm còi để yêu cầu họ về đúng làn.[cite: 1]", "D. Phanh gấp ngay khi thấy bánh xe tải bắt đầu đè lên vạch phân làn.[cite: 1]"], a: 1 },
            { q: "Câu 6: Một chiếc xe tải lớn di chuyển phía trước đang bắt đầu thực hiện thao tác bật xi nhan và lấn dần sang làn đường khác. Phương án xử lý của bạn là:[cite: 1]", o: ["A. Tăng tốc để lách vào khoảng trống mà xe tải vừa để lại ở làn cũ.[cite: 1]", "B. Chủ động giảm tốc độ và duy trì khoảng cách an toàn với xe tải.[cite: 1]", "C. Giữ tốc độ và cố gắng chạy song song, không để xe tải chuyển làn.[cite: 1]", "D. Phanh gấp và tránh xa xe tải để tránh va chạm.[cite: 1]"], a: 1 },
            { q: "Câu 7: Tại một khúc cua gấp trên đường đèo, bạn phát hiện một chiếc xe con đối diện đang mất lái và lao tới với tốc độ rất nhanh về phía xe bạn. Phương án xử lý của bạn là:[cite: 1]", o: ["A. Nhấn ga tăng tốc để thoát khỏi điểm va chạm trong tích tắc.[cite: 1]", "B. Phanh gấp và đứng yên chờ đợi va chạm xảy ra.[cite: 1]", "C. Bấm còi và đánh lái sang làn đường đối diện để tránh xe kia.[cite: 1]", "D. Rà phanh giảm tốc độ tối đa, giữ khoảng cách an toàn và nép sát vào lề phải.[cite: 1]"], a: 3 },
            { q: "Câu 8: Tại giao lộ, mặc dù hướng của bạn đang xanh nhưng một chiếc xe máy bất ngờ tăng tốc vượt đèn đỏ và cắt ngang hướng di chuyển của bạn. Phương án xử lý của bạn là:[cite: 1]", o: ["A. Nhấn ga tăng tốc để cảnh cáo hành vi vi phạm của người đi xe máy.[cite: 1]", "B. Giảm tốc độ, giữ khoảng cách an toàn và nhường đường để đảm bảo an toàn.[cite: 1]", "C. Nhấn còi liên tục và không thay đổi tốc độ vì mình đi đúng luật.[cite: 1]", "D. Phanh gấp ngay giữa giao lộ và chờ xe máy đi qua.[cite: 1]"], a: 1 },
            { q: "Câu 9: Xe đi phía trước không giữ được làn đường ổn định, liên tục đánh lái sang trái rồi lại sang phải một cách vô thức. Phương án xử lý của bạn là:[cite: 1]", o: ["A. Hạ tốc độ, duy trì khoảng cách an toàn lớn và chú ý quan sát kỹ.[cite: 1]", "B. Nhấn ga tăng tốc để vượt qua chiếc xe này thật nhanh để va chạm.[cite: 1]", "C. Chạy song song sát cạnh để chiếc xe đó đánh lái sang được.[cite: 1]", "D. Bám sát đuôi xe và bấm còi liên tục để nhắc nhở tài xế phía trước.[cite: 1]"], a: 0 },
            { q: "Câu 10: Tình hình giao thông bắt đầu trở nên căng thẳng, các phương tiện phía trước đang dừng nối đuôi nhau hàng loạt do có ùn tắc tại giao lộ phía trên. Phương án xử lý của bạn là:[cite: 1]", o: ["A. Tìm kẽ hở nhỏ nhất giữa các xe để tìm cách lách vào.[cite: 1]", "B. Giảm tốc độ, duy trì khoảng cách an toàn và kiên nhẫn di chuyển theo dòng xe.[cite: 1]", "C. Bám thật sát đuôi xe phía trước để không bị các xe khác chen ngang vào đầu xe.[cite: 1]", "D. Bấm còi liên tục và dài để yêu cầu các phương tiện phía trước phải di chuyển.[cite: 1]"], a: 1 }
        ],
        "9": [
            { q: "Câu 1: Bạn đang tiến tới một giao lộ phía bên trái có tầm nhìn hạn chế do tường rào. Đột ngột một chiếc xe con từ đường nhánh tiến ra và có dấu hiệu cắt ngang qua hướng di chuyển của bạn để sang đường. Phương án xử lý của bạn là:[cite: 1]", o: ["A. Giữ nguyên tốc độ vì bạn đang lưu thông trên đường ưu tiên.[cite: 1]", "B. Tăng tốc để nhanh chóng vượt qua đầu xe con trước khi họ lao ra giữa đường.[cite: 1]", "C. Đánh lái gấp sang phải để né tránh va chạm.[cite: 1]", "D. Chủ động giảm tốc độ, đặt chân vào bàn đạp phanh và sẵn sàng dừng lại nếu xe con không nhường.[cite: 1]"], a: 3 },
            { q: "Câu 2: Bạn đang lưu thông trên đường thì thấy chiếc xe phía trước dừng lại khá lâu giữa làn đường. Bất ngờ, đèn lùi của xe đó bật sáng và xe bắt đầu lùi thẳng về phía đầu xe bạn. Phương án xử lý của bạn là:[cite: 1]", o: ["A. Nhấn ga tăng tốc và lách nhanh sang làn bên cạnh để tránh.[cite: 1]", "B. Bấm còi liên tục và bám sát đuôi xe phía trước để buộc họ dừng lùi.[cite: 1]", "C. Dừng xe lại ở khoảng cách an toàn, giữ khoảng trống đủ để xử lý tình huống.[cite: 1]", "D. Quan sát phía sau và lùi xe đến khi xe phía trước dừng lại.[cite: 1]"], a: 2 },
            { q: "Câu 3: Bạn quan sát thấy một đàn vật nuôi đang tập trung bên lề đường và một vài con bắt đầu mất kiểm soát, chạy băng cắt qua đường ngay trước mũi xe bạn. Phương án xử lý của bạn là:[cite: 1]", o: ["A. Giữ tốc độ và bấm còi để ép đàn vật nuôi phải dừng lại chờ xe qua.[cite: 1]", "B. Bấm còi liên tục để xua hối thúc đàn gia súc nhanh chóng ra khỏi quốc lộ.[cite: 1]", "C. Giảm tốc độ đến mức dừng hẳn nếu cần, không cố tình tăng tốc để ép qua.[cite: 1]", "D. Phanh gấp tại con vật đang đi đầu đàn để buộc cả đàn phải chạy nhanh hơn.[cite: 1]"], a: 2 },
            { q: "Câu 4: Tầm nhìn phía trước của bạn bị một chiếc xe tải đang đỗ che khuất, bất ngờ có một người đi xe máy đi ngược chiều đi ra từ phía đầu chiếc xe tải đó. Phương án xử lý của bạn là:[cite: 1]", o: ["A. Rà nhẹ chân phanh trước khi vượt qua xe tải và duy trì khoảng cách an toàn.[cite: 1]", "B. Bấm còi liên tục để xe máy ngược chiều phải dạt vào lề.[cite: 1]", "C. Nhấn ga tăng tốc để vượt qua đoạn khuất của xe tải thật nhanh.[cite: 1]", "D. Phanh gấp ngay lập tức khi phát hiện có bóng xe máy.[cite: 1]"], a: 0 },
            { q: "Câu 5: Một chiếc xe container ở làn bên cạnh đột ngột đánh lái chuyển hướng cắt ngang qua đầu xe bạn mà không hề có tín hiệu bảo trước. Phương án xử lý của bạn là:[cite: 1]", o: ["A. Đánh lái và tăng tốc để cố gắng lách qua trước khi xe container cắt đầu.[cite: 1]", "B. Lập tức giảm tốc độ, giữ khoảng cách an toàn để tránh va chạm trực diện.[cite: 1]", "C. Phanh gấp để tránh xa container vượt ẩu.[cite: 1]", "D. Giữ nguyên ga và không đạp phanh để buộc tài xế xe lớn phải nhường.[cite: 1]"], a: 1 },
            { q: "Câu 6: Một chiếc xe 16 chỗ từ đường nhánh phía bên phải đang từ từ tiến ra và bắt đầu nhập vào làn đường của bạn một cách quyết đoán. Phương án xử lý của bạn là:[cite: 1]", o: ["A. Nhấn ga tăng tốc để xe 16 chỗ không thể nhập làn thành công.[cite: 1]", "B. Hạ tốc độ từ sớm, giữ khoảng cách an toàn để tạo điều kiện cho xe nhập làn.[cite: 1]", "C. Bám sát đuôi xe phía trước, không cho xe khách nhập làn.[cite: 1]", "D. Nhấn còi liên tục và giữ tốc độ, kiên quyết không nhường đường.[cite: 1]"], a: 1 },
            { q: "Câu 7: Bạn đang di chuyển trên đoạn đường cong vào ban ngày, mặc dù có biển bảo nguy hiểm nhưng tầm nhìn phía trước vẫn bị che khuất hoàn toàn bởi vách núi. Phương án xử lý của bạn là:[cite: 1]", o: ["A. Tăng tốc độ để thử cảm giác lái qua những khúc cua.[cite: 1]", "B. Nhấn còi liên tục nhưng vẫn giữ nguyên tốc độ cao để cảnh báo xe đối diện.[cite: 1]", "C. Đánh lái rộng sang làn đường ngược chiều để mở rộng tầm mắt nhìn xa hơn.[cite: 1]", "D. Hạ tốc độ, giữ khoảng cách an toàn và chú ý quan sát gương cầu lồi nếu có.[cite: 1]"], a: 3 },
            { q: "Câu 8: Bạn đang di chuyển qua đoạn đường có nhiều ngõ, một chiếc xe máy từ ngõ bất ngờ nhập vào làn đường chính ngay trước mặt bạn với tốc độ chậm. Phương án xử lý của bạn là:[cite: 1]", o: ["A. Tăng tốc không cho xe máy có cơ hội nhập vào làn của bạn.[cite: 1]", "B. Chủ động giảm tốc độ, giữ khoảng cách an toàn để xe máy nhập làn an toàn.[cite: 1]", "C. Bám sát xe máy và nhấn còi liên tục để hối thúc họ tăng tốc theo bạn.[cite: 1]", "D. Đánh lái gấp sang làn ngược chiều để tránh phải giảm tốc độ.[cite: 1]"], a: 1 },
            { q: "Câu 9: Một chiếc xe con phía trước chạy rất chậm và bất ngờ bật đèn cảnh báo nguy hiểm (hazard), bảo hiệu xe đang gặp sự cố kỹ thuật. Phương án xử lý của bạn là:[cite: 1]", o: ["A. Đánh lái sáng làn khác và nhấn ga tăng tốc để vượt qua chiếc xe hỏng đó.[cite: 1]", "B. Bám sát vào đuôi xe và bấm còi mạnh để yêu cầu họ phải dạt vào lề đường.[cite: 1]", "C. Giảm tốc độ, giữ khoảng cách an toàn và quan sát để vượt qua khi đủ điều kiện.[cite: 1]", "D. Phanh gấp ngay phía sau xe hỏng và bật đèn cảnh báo để dừng lại cùng họ.[cite: 1]"], a: 2 },
            { q: "Câu 10: Con đường bạn đang đi bắt đầu thu hẹp lại do có biển bảo đường hẹp, chiếc xe đi trước đang thực hiện việc giảm tốc độ để tiến vào đoạn đường này. Phương án xử lý của bạn là:[cite: 1]", o: ["A. Nhấn ga tăng tốc để vượt lên chiếm vị trí trước xe phía trước tại đoạn đường hẹp.[cite: 1]", "B. Hạ tốc độ, giữ khoảng cách an toàn và lần lượt di chuyển vào đoạn đường hẹp.[cite: 1]", "C. Chạy song song với xe trước để cùng nhau đi vào đoạn đường bị thu hẹp.[cite: 1]", "D. Phanh gấp ngay tại điểm bắt đầu đoạn đường hẹp khiến giao thông bị tắc nghẽn.[cite: 1]"], a: 1 }
        ],
        "10": [
            { q: "Câu 1: Phía trước bạn là một chiếc xe bồn trộn bê tông đang chiếm phần lớn diện tích mặt đường. Tài xế xe bê tông bắt đầu lấn dần sang làn đường của bạn để tránh một vật cản bên lề đường của họ. Phương án xử lý của bạn là:[cite: 1]", o: ["A. Nhấn ga mạnh để vượt qua xe bê tông trước khi bị ép vào lề.[cite: 1]", "B. Đi song song với xe bê tông để yêu cầu họ giữ đúng làn đường.[cite: 1]", "C. Chủ động giảm tốc độ và nhường đường, ép xe về phía an toàn bên phải.[cite: 1]", "D. Bám sát đuôi xe bê tông và bấm còi liên tục để phản đối.[cite: 1]"], a: 2 },
            { q: "Câu 2: Tại một ngã tư lớn, có một chiếc xe khách 16 chỗ đang chờ và bắt đầu từ từ tiến ra để chiếm làn đường chính. Do thân xe dài và điểm mù lớn, tài xế có thể không quan sát thấy xe bạn. Phương án xử lý của bạn là:[cite: 1]", o: ["A. Tăng tốc và nháy đèn pha để ép xe 16 chỗ phải dừng lại nhường đường.[cite: 1]", "B. Chủ động giảm tốc độ từ sớm vì xe lớn khó quan sát, sẵn sàng nhường đường.[cite: 1]", "C. Bấm còi liên tục và đi sát vào đầu xe 16 chỗ để khẳng định ưu tiên.[cite: 1]", "D. Đánh lái sang phần đường đối diện, tăng tốc để vượt qua xe khách.[cite: 1]"], a: 1 },
            { q: "Câu 3: Bạn đang lái xe qua khu dân cư gần trường học, bất ngờ một đứa trẻ từ vĩa hè chạy vụt xuống lòng đường mà không quan sát xung quanh. Phương án xử lý của bạn là:[cite: 1]", o: ["A. Nhấn còi liên tục và giữ nguyên tốc độ để đứa trẻ tự sợ mà quay lại.[cite: 1]", "B. Tăng tốc để vượt qua trước khi đứa trẻ chạy ra đến giữa làn đường.[cite: 1]", "C. Hạ tốc độ sớm nhất có thể, đặt chân vào phanh và sẵn sàng dừng để nhường đường.[cite: 1]", "D. Đánh lái gấp sang làn đường ngược chiều để tránh va chạm với đứa trẻ.[cite: 1]"], a: 2 },
            { q: "Câu 4: Tại giao lộ phía trước, chiếc xe con đang di chuyển bỗng nhiên tăng tốc đột ngột và đánh lái rẽ trái với tốc độ rất cao ngay trước mặt xe bạn. Phương án xử lý của bạn là:[cite: 1]", o: ["A. Hạ tốc độ, giữ khoảng cách an toàn và chú ý quan sát hướng di chuyển của xe.[cite: 1]", "B. Nhấn còi liên tục để cảnh báo cho xe con.[cite: 1]", "C. Đánh lái sang làn bên cạnh để vượt qua trước khi xe con hoàn thành cú rẽ.[cite: 1]", "D. Phanh gấp ngay lập tức để tránh va chạm.[cite: 1]"], a: 0 },
            { q: "Câu 5: Trên đường hai chiều không có dải phân cách cứng, một chiếc xe tải đi đối diện bất ngờ lấn hẳn sang phần đường bạn đang di chuyển để vượt xe khác. Phương án xử lý của bạn là:[cite: 1]", o: ["A. Nháy đèn pha liên tục, tăng tốc để ép xe tải phải quay lại làn cũ.[cite: 1]", "B. Đánh lái sang làn ngược chiều của xe tải để né tránh va chạm.[cite: 1]", "C. Hạ tốc độ, giữ khoảng cách an toàn và đi sát về phía lề đường bên phải.[cite: 1]", "D. Phanh gấp và dừng xe ngày để chờ xe tải đi qua.[cite: 1]"], a: 2 },
            { q: "Câu 6: Tại vị trí đường nhập làn cao tốc, bạn thấy một chiếc xe con đang tăng tốc mạnh để nhập vào làn chính ngay sát phía trước đầu xe của bạn. Phương án xử lý của bạn là:[cite: 1]", o: ["A. Tăng tốc để xe con phải lùi lại hoặc dừng lại ở làn nhập.[cite: 1]", "B. Rà nhẹ phanh để giảm tốc độ, tạo khoảng trống an toàn cho xe khác nhập làn.[cite: 1]", "C. Bấm còi liên tục để cảnh báo xe phía trước giữ vị trí.[cite: 1]", "D. Phanh gấp ngay tại điểm nhập làn để tránh va chạm.[cite: 1]"], a: 1 },
            { q: "Câu 7: Bạn điều khiển xe qua cung đường có nhiều khúc cua chữ S liên tiếp, mặt đường hẹp và trơn trượt khiến việc quan sát xa cực kỳ khó khăn. Phương án xử lý của bạn là:[cite: 1]", o: ["A. Tăng tốc để rút ngắn thời gian di chuyển qua đoạn đường này.[cite: 1]", "B. Phanh gấp tại mỗi đỉnh cua để đảm bảo xe không bị văng khỏi đường.[cite: 1]", "C. Luôn điều khiển xe chạy vào giữa mặt đường để dễ dàng đánh lái sang hai bên.[cite: 1]", "D. Giảm tốc độ phù hợp, giữ khoảng cách an toàn và đi đúng phần đường quy định.[cite: 1]"], a: 3 },
            { q: "Câu 8: Bạn đang lái xe trên đoạn đường có mặt đường rất xấu, chiếc xe tải phía trước liên tục đánh lái qua hai bên để né các hố sâu và đá hộc. Phương án xử lý của bạn là:[cite: 1]", o: ["A. Kiên nhẫn giảm tốc độ, giữ khoảng cách an toàn tối đa với xe phía trước.[cite: 1]", "B. Bám sát và sẵn sàng tăng tốc để tìm cơ hội vượt qua chiếc xe tải đi chậm đó.[cite: 1]", "C. Đánh lái liên tục cùng với xe tải phía trước để né ổ gà.[cite: 1]", "D. Giữ tốc độ và phanh gấp mỗi khi bạn thấy xe tải phía trước đỏ đèn phanh.[cite: 1]"], a: 0 },
            { q: "Câu 9: Bạn đang đi sau một chiếc xe chở đồ nội thất cồng kềnh, hàng hóa vượt quá kích thước thùng xe và đang rung lắc dữ dội theo mỗi nhịp xe chạy. Phương án xử lý của bạn là:[cite: 1]", o: ["A. Nhấn ga tăng tốc để vượt qua thật nhanh trước khi hàng hóa rơi xuống đầu xe bạn.[cite: 1]", "B. Chủ động giảm tốc độ và duy trì khoảng cách an toàn cực lớn với xe tải.[cite: 1]", "C. Chạy song song xe tải và ra hiệu cho tài xế biết hàng hóa đang bị lỏng lẻo.[cite: 1]", "D. Bấm còi hối thúc xe tải chạy nhanh hơn để mau chóng kết thúc đoạn đường này.[cite: 1]"], a: 1 },
            { q: "Câu 10: Phía trước là một cây cầu hẹp chỉ đủ một làn xe, chiếc xe khách phía trước đang đi chậm lại để quan sát và chuẩn bị đi qua cầu. Phương án xử lý của bạn là:[cite: 1]", o: ["A. Nhấn ga tăng tốc để vượt xe khách ngay khi xe đó bắt đầu lên cầu hẹp.[cite: 1]", "B. Giảm tốc độ, giữ khoảng cách an toàn và chờ xe phía trước qua cầu xong.[cite: 1]", "C. Bấm còi liên tục để tài xế xe khách phải đi nhanh hơn trên cầu.[cite: 1]", "D. Bám sát đuôi xe khách để ngăn cản không cho xe đối diện có cơ hội lên cầu.[cite: 1]"], a: 1 }
        ],
        "11": [
            { q: "Câu 1: Chiếc xe con đang di chuyển ngay phía trước bạn bật tín hiệu xi nhan trái và bắt đầu rà phanh, chuẩn bị đánh lái để rẽ vào một con ngõ phía bên trái. Phương án xử lý của bạn là:[cite: 1]", o: ["A. Tăng tốc và tìm cách vượt lên phía bên trái của xe đang rẽ.[cite: 1]", "B. Giữ khoảng cách an toàn lớn hơn, chủ động giảm tốc độ để tránh tình huống cắt đầu.[cite: 1]", "C. Bám sát đuôi xe phía trước và nhấn còi hối thúc họ rẽ nhanh hơn.[cite: 1]", "D. Phanh gấp ngay khi thấy đèn xi nhan của xe phía trước bật sáng để đảm bảo an toàn.[cite: 1]"], a: 1 },
            { q: "Câu 2: Một chiếc xe tải đang dừng đỗ trái phép giữa đường làm che khuất hoàn toàn tầm nhìn phía trước, khiến các phương tiện đi trước bạn phải lấn sang làn ngược chiều để vượt qua. Phương án xử lý của bạn là:[cite: 1]", o: ["A. Giữ tốc độ, bám đuôi xe phía trước để cùng vượt qua xe tải thật nhanh.[cite: 1]", "B. Tuyệt đối không vượt ngay, giảm tốc độ và quan sát kỹ phía trước trước khi quyết định.[cite: 1]", "C. Nháy đèn pha và bấm còi liên tục để yêu cầu xe tải phải di chuyển đi nơi khác.[cite: 1]", "D. Đánh lái sang làn bên cạnh để không cho các xe ngược chiều chen vào.[cite: 1]"], a: 1 },
            { q: "Câu 3: Ven đường có một nhóm trẻ em đang nô đùa, chạy nhảy sát mép đường. Có nguy cơ cao một trong số trẻ sẽ chạy bất ngờ ra lòng đường để đuổi theo bóng hoặc bạn bè. Phương án xử lý của bạn là:[cite: 1]", o: ["A. Giữ nguyên tốc độ ổn định và chỉ tập trung nhìn thẳng về phía trước.[cite: 1]", "B. Bấm còi thật to để nhóm trẻ em sợ mà đi vào trong.[cite: 1]", "C. Tăng tốc để mau chóng đi qua khu vực có trẻ em vui chơi.[cite: 1]", "D. Di chuyển với tốc độ rất chậm, luôn giữ chân vào bàn đạp phanh để xử lý kịp thời.[cite: 1]"], a: 3 },
            { q: "Câu 4: Phương tiện phía trước bật tín hiệu xi nhan rẽ trái và bạn nhận thấy chiếc xe máy đó bắt đầu chuyển hướng dần sang làn đường của bạn. Phương án xử lý của bạn là:[cite: 1]", o: ["A. Tăng tốc để cố gắng vượt xe máy từ phía bên trái trước khi họ rẽ.[cite: 1]", "B. Bấm còi hối thúc xe máy phải nhanh chóng thực hiện thao tác rẽ.[cite: 1]", "C. Giảm tốc độ, duy trì khoảng cách an toàn và theo dõi sát hướng rẽ của xe máy.[cite: 1]", "D. Bám sát xe máy để gây áp lực buộc họ phải rẽ nhanh hơn.[cite: 1]"], a: 2 },
            { q: "Câu 5: Đang di chuyển trên đường cao tốc, bạn bàng hoàng phát hiện xe phía trước bật đèn lùi và bắt đầu di chuyển ngược chiều về phía bạn. Phương án xử lý của bạn là:[cite: 1]", o: ["A. Đánh lái và lách nhanh sang làn đường khác để vượt qua xe lùi.[cite: 1]", "B. Hạ tốc độ, giữ khoảng cách an toàn và chỉ dừng xe hoàn toàn khi thực sự cần.[cite: 1]", "C. Nhấn còi liên tục để cảnh báo các xe đang lùi dừng lại.[cite: 1]", "D. Dừng xe vào làn cao tốc để quan sát và gọi cứu hộ.[cite: 1]"], a: 1 },
            { q: "Câu 6: Xe đi ngược chiều liên tục nháy đèn pha với cường độ mạnh vào thẳng mắt bạn khi đang di chuyển trên quốc lộ vào buổi tối. Phương án xử lý của bạn là:[cite: 1]", o: ["A. Chủ động giảm tốc độ, giữ khoảng cách an toàn và tập trung quan sát lề đường phải.[cite: 1]", "B. Nháy đèn pha đáp trả và tăng tốc độ để nhanh chóng đi qua xe đó.[cite: 1]", "C. Đánh lái lấn sang làn đối diện để phản đối hành vi dùng đèn pha của họ.[cite: 1]", "D. Phanh gấp ngay giữa đường để dừng lại hỏi rõ nguyên nhân bị nháy đèn.[cite: 1]"], a: 0 },
            { q: "Câu 7: Màn sương mù tiếp tục bao phủ dày đặc hơn, bạn hoàn toàn không nhìn rõ đèn hậu của xe đi trước cũng như vạch kẻ đường bên dưới. Phương án xử lý của bạn là:[cite: 1]", o: ["A. Giữ tốc độ để bám sát theo bóng mờ của xe phía trước cho dễ đi.[cite: 1]", "B. Chủ động giảm tốc độ về mức cực thấp, giữ khoảng cách an toàn và quan sát kỹ.[cite: 1]", "C. Bật đèn pha và nhấn ga để di chuyển tiếp hành trình.[cite: 1]", "D. Phanh gấp liên tục để kiểm tra xem hệ thống phanh có bị ảnh hưởng bởi độ ẩm không.[cite: 1]"], a: 1 },
            { q: "Câu 8: Chiếc xe đi ngay phía trước chạy rất không ổn định, lúc nhanh lúc chậm và đèn phanh liên tục bật sáng dù đường đang thoảng. Phương án xử lý của bạn là:[cite: 1]", o: ["A. Nhấn ga tăng tốc để vượt qua xe này càng sớm càng tốt cho an toàn.[cite: 1]", "B. Bám thật sát đuôi xe phía trước và bấm còi liên tục để tài xế tập trung lái.[cite: 1]", "C. Hạ tốc độ, duy trì khoảng cách an toàn và quan sát kỹ mọi diễn biến phía trước.[cite: 1]", "D. Phanh gấp giữa đường để tạo một khoảng cách cực xa với chiếc xe bất thường đó.[cite: 1]"], a: 2 },
            { q: "Câu 9: Tại một đoạn đường dốc dài và cao, một chiếc xe tải phía trước đang đổ dốc và có dấu hiệu mất kiểm soát tốc độ, lao đi rất nhanh. Phương án xử lý của bạn là:[cite: 1]", o: ["A. Tăng tốc để cố gắng bám theo và gọi cho cứu hộ khi xe tải gặp nguy hiểm.[cite: 1]", "B. Hạ tốc độ, giữ khoảng cách an toàn tối đa để tránh các tình huống xấu nhất.[cite: 1]", "C. Phanh gấp liên tục để giữ khoảng cách xe mình luôn cố định với xe tải.[cite: 1]", "D. Nhấn còi dồn dập với hy vọng tài xế xe tải sẽ hãm phanh lại.[cite: 1]"], a: 1 },
            { q: "Câu 10: Mặt đường phía trước vừa có trận mưa rào nên rất trơn trượt, xe đi trước đang thực hiện việc giảm tốc độ để đảm bảo an toàn khi vào cua. Phương án xử lý của bạn là:[cite: 1]", o: ["A. Nhấn ga tăng tốc để đi qua đoạn đường ướt thật nhanh.[cite: 1]", "B. Chủ động hạ tốc độ, duy trì khoảng cách an toàn tối đa với phương tiện đi trước.[cite: 1]", "C. Phanh liên tục để tự kiểm tra độ bám đường của lốp xe mình.[cite: 1]", "D. Bám thật sát vào đuôi xe phía trước để tận dụng vệt nước đã bị xe trước gạt đi.[cite: 1]"], a: 1 }
        ]
    };

    let timerInterval;
    let timeLeft = 10 * 60; // 10 phút cho 10 câu
    let currentExam = [];

    function startExam() {
        const examId = document.getElementById("examSelect").value;
        currentExam = mockData[examId] || [];

        document.getElementById("startBtn").style.display = "none";
        document.getElementById("submitBtn").style.display = "block";
        document.getElementById("resultArea").style.display = "none";
        
        renderQuestions();
        
        clearInterval(timerInterval);
        timeLeft = 10 * 60;
        timerInterval = setInterval(updateTimer, 1000);
    }

    function renderQuestions() {
        const examArea = document.getElementById("examArea");
        examArea.innerHTML = "";
        
        currentExam.forEach((item, index) => {
            const div = document.createElement("div");
            div.className = "question-card";
            
            let optionsHtml = "";
            item.o.forEach((opt, i) => {
                optionsHtml += `<label><input type="radio" name="q${index}" value="${i}"> ${opt}</label>`;
            });

            div.innerHTML = `<h3>${item.q}</h3><div class="options">${optionsHtml}</div>`;
            examArea.appendChild(div);
        });
    }

    function updateTimer() {
        const m = Math.floor(timeLeft / 60);
        const s = timeLeft % 60;
        document.getElementById("timer").innerText = `Thời gian: ${m < 10 ? '0'+m : m}:${s < 10 ? '0'+s : s}`;
        
        if (timeLeft <= 0) {
            clearInterval(timerInterval);
            submitExam();
        }
        timeLeft--;
    }

    function submitExam() {
        clearInterval(timerInterval);
        let score = 0;
        
        currentExam.forEach((item, index) => {
            const selected = document.querySelector(`input[name="q${index}"]:checked`);
            if (selected && parseInt(selected.value) === item.a) {
                score++;
            }
        });

        const resultArea = document.getElementById("resultArea");
        resultArea.style.display = "block";
        
        if (score >= 9) { // Đạt từ 9/10 câu trở lên
            resultArea.className = "result pass";
            resultArea.innerHTML = `Tạm được, M đạt ${score}/${currentExam.length} câu. Đủ điểm qua môn!`;
        } else {
            resultArea.className = "result fail";
            resultArea.innerHTML = `😏  M chỉ đạt ${score}/${currentExam.length} câu. (Cần tối thiểu 9/10 câu). Ahihi lêu lêu!`;
        }
        
        document.getElementById("submitBtn").style.display = "none";
        document.getElementById("startBtn").style.display = "block";
        document.getElementById("startBtn").innerText = "Làm lại / Chọn đề khác";
    }
</script>

</body>
</html>
